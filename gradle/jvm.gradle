apply from: "$rootDir/gradle/config.gradle"

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'maven-publish'

javadoc {
    // noinspection GroovyAssignabilityCheck
    options {
        charSet = encoding
        docEncoding = encoding
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of("${versions.jdk}".toInteger())
    }
    sourceCompatibility = versions.jdk
    targetCompatibility = versions.jdk

    withJavadocJar()
    withSourcesJar()
}

// Captures all source files (Java, Kotlin, etc.) registered to the main source set.
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier = 'sources'
    archiveExtension = 'jar'

    from project.sourceSets.main.allSource
}

// DO NOT wrap the following in project.afterEvaluate!
publishing {
    publications {
        // noinspection GroovyAssignabilityCheck
        mavenJava(MavenPublication) {
            // Explicitly publish only your exact primary and secondary jars
            artifact tasks.named('jar').get()
            artifact tasks.named('sourcesJar').get()
            artifact tasks.named('javadocJar').get()

            // Manually map runtime dependencies to the POM file so consumers can resolve them
            pom.withXml {
                final dependenciesNode = asNode().appendNode('dependencies')
                project.configurations.implementation.allDependencies.each { dep ->
                    if (dep.group != null && dep.name != null) {
                        final dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', dep.group)
                        dependencyNode.appendNode('artifactId', dep.name)
                        dependencyNode.appendNode('version', dep.version ?: 'unspecified')
                        dependencyNode.appendNode('scope', 'runtime')
                    }
                }
            }
        }
    }
}

// The JAXB APIs are considered to be Java EE APIs and therefore are no longer contained
// on the default classpath in Java SE 9. In Java 11, they are completely removed from the JDK.
dependencies {
    implementation 'javax.xml.bind:jaxb-api:2.3.0'
    implementation 'com.sun.xml.bind:jaxb-core:2.3.0'
    implementation 'com.sun.xml.bind:jaxb-impl:2.3.0'
}
